# The identity External Secrets presents to Vault. The Vault role is bound to
# exactly this name in exactly this namespace (see scripts/bootstrap-vault.sh).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-demo
  namespace: demo
---
# The app never talks to Vault or to the API server, so it gets no token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: demo
automountServiceAccountToken: false

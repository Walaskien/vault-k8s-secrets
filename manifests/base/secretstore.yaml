apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: demo
spec:
  provider:
    vault:
      # Plain HTTP because the demo Vault runs in dev mode without TLS.
      server: http://vault.vault.svc:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: demo-app
          serviceAccountRef:
            name: eso-demo
            # Must match "audience" on the Vault role, so only a token minted for Vault can log in.
            audiences:
              - vault

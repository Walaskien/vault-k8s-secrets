apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secret
  namespace: demo
spec:
  # 15s so the demo and CI see a rotation quickly. The default is 1h, which is
  # also a fair value when a delay of that size is acceptable.
  refreshInterval: 15s
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: app-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: demo/app
        property: username
    - secretKey: password
      remoteRef:
        key: demo/app
        property: password

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.4
      - run: pip install -r requirements-dev.txt
      # yamllint, kubeconform (External Secrets schemas from the CRD catalog) on the
      # rendered kustomize and Helm output, shellcheck, actionlint.
      - run: make check

  # Vault dev + Postgres in plain Docker: bootstrap twice, policy limits, database engine.
  vault-docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: make docker-test

  e2e:
    needs: [lint, vault-docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: v4.2.4
      - uses: helm/kind-action@v1.15.2
        with:
          version: v0.33.0
          cluster_name: vault-demo
          config: kind/kind-config.yaml
      - name: Vault (dev mode), External Secrets, demo app
        run: make deploy
      - name: Secret delivery, rotation, least privilege
        run: make e2e
      - name: Dynamic database credentials
        run: |
          make deploy-db
          make e2e-db
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl get pods -A
          kubectl -n demo get externalsecret,secretstore -o wide || true
          kubectl -n demo get vaultdynamicsecrets.generators.external-secrets.io || true
          kubectl -n demo describe externalsecret || true
          kubectl -n external-secrets logs deploy/external-secrets --tail=100 || true
          kubectl -n vault logs vault-0 --tail=60 || true
